name: Build the wire

on:
  schedule:
    - cron: "0 11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the feeds
        run: python3 wichita_wire.py --days 3 --discover --out docs/index.html
      - name: Commit the page
        run: |
          git config user.name "wire-bot"
          git config user.email "wire-bot@users.noreply.github.com"
          git add docs/index.html wire_feeds.json
          git diff --staged --quiet || git commit -m "wire: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
